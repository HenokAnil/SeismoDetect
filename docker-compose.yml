version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: seismodetect_postgres
    environment:
      POSTGRES_USER: seismo_user
      POSTGRES_PASSWORD: seismo_password
      POSTGRES_DB: seismodetect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: seismodetect_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    container_name: seismodetect_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: seismodetect_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: seismodetect_backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio
      - redis
      - qdrant
    environment:
      - DATABASE_URL=postgresql://seismo_user:seismo_password@postgres:5432/seismodetect
      - MINIO_ENDPOINT=minio:9000
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
    volumes:
      - ./backend/models/checkpoints:/app/backend/models/checkpoints

volumes:
  postgres_data:
  minio_data:
  redis_data:
  qdrant_data:
